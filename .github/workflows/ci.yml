name: CI

on:
  pull_request:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show Python version
        run: python --version

      - name: CLI help smoke test
        run: python -m watchdog_v2 --help

      - name: CLI parser smoke tests (Python 3.11)
        run: python -m unittest tests/test_cli_smoke.py -v

      - name: Byte-compile source files
        run: python -m py_compile watchdog_v2/*.py rehearsal/lib/*.py rehearsal/tools/*.py tests/test_runtime_wrapper.py tests/test_config.py tests/test_reporting.py tests/test_cli_smoke.py

      - name: Focused regression tests
        run: python -m unittest discover -s tests -v

      - name: Rehearsal smoke scenarios
        run: |
          bash rehearsal/scripts/run-scenario.sh bootstrap-missing-openclaw
          bash rehearsal/scripts/run-scenario.sh watchdog-active-no-listener-grace
