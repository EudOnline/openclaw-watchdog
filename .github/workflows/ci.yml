name: CI

on:
  pull_request:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show Python version
        run: python --version

      - name: Install quality tools
        run: python -m pip install ruff mypy

      - name: Ruff
        run: python -m ruff check openclaw_watchdog/config.py openclaw_watchdog/presenters tests/test_ci_contract.py tests/test_docs_surface.py

      - name: Mypy
        run: python -m mypy openclaw_watchdog/config.py

      - name: CLI help smoke test
        run: python -m openclaw_watchdog --help

      - name: CLI parser smoke tests
        run: python -m unittest tests/test_cli_smoke.py -v

      - name: Byte-compile source files
        run: python -m py_compile openclaw_watchdog/*.py openclaw_watchdog/presenters/*.py openclaw_watchdog/flows/*.py rehearsal/lib/*.py rehearsal/tools/*.py tests/*.py

      - name: Full unittest suite
        run: python -m unittest discover -s tests -v

      - name: Rehearsal critical scenarios
        if: matrix.python-version == '3.11'
        run: bash rehearsal/scripts/run-scenario.sh critical
