name: OpenClaw Upstream Scout

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  scout:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run upstream scout
        env:
          SCOUT_OUTPUT_DIR: ${{ github.workspace }}/.tmp/openclaw-upstream-scout
        run: bash scripts/scout-openclaw-upstream.sh

      - name: Upload scout artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-upstream-scout
          path: ${{ github.workspace }}/.tmp/openclaw-upstream-scout
          if-no-files-found: error
